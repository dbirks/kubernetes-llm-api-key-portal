name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  # Required for the build attestation below.
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # An immutable sha tag always exists, so a deployment can pin to an
          # exact commit rather than a moving tag.
          #
          # The timestamp-prefixed tag exists so Flux's image-reflector can pick
          # "newest" by sorting: a bare sha is immutable but not orderable, and
          # `main` is orderable only by being mutable, which defeats pinning.
          # It carries the same digest as the sha tag; nothing extra is built.
          #
          # commit_date, not date: the build clock would make a re-run of an old
          # commit sort ahead of every newer one, so retrying a failed publish
          # would quietly roll the cluster backwards. The commit clock cannot.
          # github.sha rather than the {{sha}} expression, which is the 7-char
          # short form — the consuming ImagePolicy matches a full 40-hex sha.
          tags: |
            type=sha,format=long
            type=raw,value={{commit_date 'YYYYMMDDHHmmss'}}-${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}-${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # actions/attest supersedes actions/attest-build-provenance. With no
      # predicate or sbom inputs it auto-generates SLSA build provenance, which
      # is exactly what the dedicated action used to do.
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
