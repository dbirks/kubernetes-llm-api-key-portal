{{define "title"}}{{.Heading}}{{end}}

{{define "main"}}
<div class="panel panel-pad panel-narrow">
  <h1>{{.Heading}}</h1>
  <p class="error-message">{{.Message}}</p>

  {{if .RequestID}}
  <p class="request-id">
    <span class="request-id-label">request</span>
    <span class="request-id-value">{{.RequestID}}</span>
  </p>
  {{end}}

  <div class="form-actions">
    {{if .User}}
    <a class="button button-outline" href="/account">Back to keys</a>
    {{else}}
    <a class="button button-outline" href="/">Go to the start</a>
    {{end}}
  </div>
</div>
{{end}}
